<!doctype html><html><head><title>ComicCraft Preview</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main><h1>Comic Preview</h1><p><a class="button" href="{{pdf_url}}" download>Download Your Comic as PDF</a></p>{% for p in layout %}<article class="card"><h2>Panel {{p.panel_number}}: {{p.title}}</h2><img src="{{p.image_path}}"><p><i>{{p.scene_description}}</i></p><p><b>Caption:</b> {{p.caption}}</p><p><b>Narration:</b> {{p.narration}}</p><p><b>Dialogue:</b> {{p.dialogue}}</p></article>{% endfor %}<a class="button" href="/">Create Another Comic</a></main></body></html>
